# Sensor model and downsampling configurations.
# Everything the scripts need about the LuSNAR lidar lives here, so the two of
# you can change one file instead of hunting through code.

sensor:
  n_beams: 128
  upper_deg: 27.0          # LuSNAR paper, Table IV
  lower_deg: -25.0
  # Lidar position in the rover body frame (x fwd, y right, z DOWN), metres.
  # LuSNAR paper, Sec. III-C / Fig. 5. Orientation is identical to the rover.
  offset_in_rover: [1.0, 0.0, -1.5]
  # Optional: path to an empirically measured beam-angle table written by
  # scripts/check_frame.py --save-beam-table. Leave null to use the nominal
  # evenly spaced angles above.
  beam_table: null

# Which frame the LiDAR/*.txt files are stored in. Run scripts/check_frame.py
# first and set this to what it reports: sensor | rover | world
point_frame: UNKNOWN

# Downsampling configurations. Each one produces its own output folder.
#   type: every_k   -> keep rings 0, k, 2k, ... (same vertical FOV, coarser spacing)
#   type: angles    -> keep the ring nearest each target elevation (mimics a real sensor)
configs:
  b128_full:
    type: every_k
    k: 1
  b64_uniform:
    type: every_k
    k: 2
  b32_uniform:
    type: every_k
    k: 4
  b16_uniform:
    type: every_k
    k: 8
  b8_uniform:
    type: every_k
    k: 16

  # Real-sensor-like angle tables (nearest available LuSNAR ring is used,
  # max snapping error ~0.2 deg).
  vlp16_like:              # Velodyne VLP-16: -15..+15 deg, 2 deg spacing
    type: angles
    angles_deg: [-15, -13, -11, -9, -7, -5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
  os1_32_like:             # Ouster OS1-32 uniform: -22.5..+22.5 deg, 32 beams
    type: angles
    linspace: [-22.5, 22.5, 32]
